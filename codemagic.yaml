workflows:
  android-release:
    name: NGGC Android Release APK
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter --version
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze || echo "Analyze completed with warnings"
        ignore_failure: true
      - name: Build Android APK (Release, split per ABI)
        script: |
          flutter build apk --release --split-per-abi
      - name: Build Universal APK (fallback)
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - lawrenceiyanuabiodun@gmail.com
        notify:
          success: true
          failure: true