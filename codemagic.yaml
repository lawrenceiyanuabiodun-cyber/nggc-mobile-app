workflows:
  android-release:
    name: NGGC Android Release APK
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      java: 17
      groups:
        - github_release
      vars:
        GITHUB_REPO: "lawrenceiyanuabiodun-cyber/nggc-mobile-app"
        RELEASE_TAG: "v1.0.0"
        APK_NAME: "NGGC.APP.apk"
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: |
          flutter --version
          flutter packages pub get

      - name: Flutter analyze
        script: |
          flutter analyze || echo "Analyze completed with warnings"
        ignore_failure: true

      - name: Build Android APK (Release)
        script: |
          flutter build apk --release

      - name: Rename APK
        script: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$APK_NAME"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK to GitHub Release
        script: |
          set -e
          echo "=== Auto-uploading $APK_NAME to GitHub release $RELEASE_TAG ==="

          APK_PATH="build/app/outputs/flutter-apk/$APK_NAME"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi

          AUTH="Authorization: token $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          API="https://api.github.com/repos/$GITHUB_REPO"

          echo "Fetching release info for tag $RELEASE_TAG..."
          RELEASE_JSON=$(curl -sS -H "$AUTH" -H "$ACCEPT" "$API/releases/tags/$RELEASE_TAG")
          RELEASE_ID=$(echo "$RELEASE_JSON" | grep -o '"id": *[0-9]*' | head -n1 | grep -o '[0-9]*')

          if [ -z "$RELEASE_ID" ]; then
            echo "Release $RELEASE_TAG not found. Creating it..."
            CREATE_PAYLOAD="{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"NGGC App $RELEASE_TAG\",\"body\":\"Auto-built by Codemagic\"}"
            CREATE_JSON=$(curl -sS -X POST -H "$AUTH" -H "$ACCEPT" "$API/releases" -d "$CREATE_PAYLOAD")
            RELEASE_ID=$(echo "$CREATE_JSON" | grep -o '"id": *[0-9]*' | head -n1 | grep -o '[0-9]*')
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Could not get or create release ID"
            echo "Response: $RELEASE_JSON"
            exit 1
          fi

          echo "Release ID: $RELEASE_ID"

          echo "Checking for existing asset named $APK_NAME..."
          ASSETS_JSON=$(curl -sS -H "$AUTH" -H "$ACCEPT" "$API/releases/$RELEASE_ID/assets")
          OLD_ASSET_ID=$(echo "$ASSETS_JSON" | tr ',' '\n' | grep -B1 "\"name\": *\"$APK_NAME\"" | grep -o '"id": *[0-9]*' | head -n1 | grep -o '[0-9]*')

          if [ -n "$OLD_ASSET_ID" ]; then
            echo "Deleting old asset ID $OLD_ASSET_ID..."
            curl -sS -X DELETE -H "$AUTH" "$API/releases/assets/$OLD_ASSET_ID"
            echo "Old asset deleted."
          else
            echo "No existing asset to delete."
          fi

          echo "Uploading new APK ($(du -h $APK_PATH | cut -f1))..."
          UPLOAD_URL="https://uploads.github.com/repos/$GITHUB_REPO/releases/$RELEASE_ID/assets?name=$APK_NAME"
          curl -sS -X POST \
            -H "$AUTH" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_PATH" \
            "$UPLOAD_URL" > /dev/null

          echo ""
          echo "=== SUCCESS! ==="
          echo "Download URL: https://github.com/$GITHUB_REPO/releases/download/$RELEASE_TAG/$APK_NAME"

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - lawrenceiyanuabiodun@gmail.com
        notify:
          success: true
          failure: true